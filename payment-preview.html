<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>הדגמת קודי תשלום סרוגים</title><style>body{margin:0;padding:25px;background:#fbf1f8;color:#2f213b;font:18px/1.6 Arial,sans-serif}main{max-width:820px;margin:auto}label{display:grid;max-width:250px}input,button{font:inherit;padding:10px}a{color:#5f3974}h1{font-size:28px}</style></head><body><main><h1>קודי תשלום סרוגים — הדגמה בלבד</h1><p>הקודים בעמוד זה מיועדים לבדיקת העיצוב והסריקה. הם אינם מובילים לחיוב או להעברת כסף.</p><label>סכום עגלה לדוגמה<input id="total" type="number" min="1" max="1000000" step="0.01" value="250"></label><button id="update">עדכון הקודים</button><div id="payments"></div><a href="./">חזרה לאתר</a></main><script type="module">import {mountPayments} from './payment.js';const input=document.querySelector('#total');input.value=new URLSearchParams(location.search).get('amount')||'250';const render=()=>mountPayments(document.querySelector('#payments'),Number(input.value),{paymentReceiverPhone:'0546671461'},{preview:true});document.querySelector('#update').onclick=render;render();</script></body></html>
