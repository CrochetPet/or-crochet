<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>כניסה לניהול | אומנות בסריגה</title><style>body{margin:0;background:#fbf5fa;color:#1c292f;font:18px/1.6 Arial,sans-serif;display:grid;min-height:100dvh;place-items:center}main{width:min(400px,calc(100% - 64px));padding:32px;background:white;border-radius:12px}h1{font-size:28px}label{display:grid;gap:8px}input,button{font:inherit;padding:12px;border:1px solid #8c7888;border-radius:6px}button{margin-top:18px;width:100%;background:#1c292f;color:white;cursor:pointer}a{color:#603951}#status{min-height:28px;color:#9f2448}</style><main><h1>כניסה לפאנל הניהול</h1><form><label>קוד כניסה<input type="password" name="password" required autocomplete="current-password"></label><button>כניסה</button><p id="status" role="alert"></p></form><a href="../">חזרה לאתר</a></main><script>
const form=document.querySelector('form'),status=document.querySelector('#status');form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;status.textContent='';try{const r=await fetch(new URL('../api/login',location.href),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:form.elements.password.value})});let data;try{data=await r.json()}catch{throw Error('הכניסה המאובטחת דורשת הפעלה של שרת הניהול')};if(!r.ok)throw Error(data.error);location.replace('./')}catch(err){status.textContent=err.message}finally{b.disabled=false}};
</script></html>
